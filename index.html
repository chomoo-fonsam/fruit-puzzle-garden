<script>
// 分享卡片兜底：上面的 og:image / twitter:image 用的是相对路径，
// 部分抓取器（尤其微信）只认绝对地址，这里在运行时补成完整 URL。
// 更稳妥的做法是按 README 说明，直接把 <meta property="og:image"> 改成你的绝对地址，
// 这样连不执行 JS 的抓取器也能取到缩略图。
(function () {
  try {
    var base = location.origin + location.pathname.replace(/[^\/]*$/, '');
    var nodes = document.querySelectorAll('meta[property="og:image"], meta[name="twitter:image"], meta[itemprop="image"]');
    for (var i = 0; i < nodes.length; i++) {
      var v = nodes[i].getAttribute('content');
      if (v && v.indexOf('://') < 0 && v.charAt(0) !== '/') {
        nodes[i].setAttribute('content', base + v);
      }
    }
    var ogUrl = document.querySelector('meta[property="og:url"]');
    if (!ogUrl) {
      ogUrl = document.createElement('meta');
      ogUrl.setAttribute('property', 'og:url');
      document.head.appendChild(ogUrl);
    }
    ogUrl.setAttribute('content', location.origin + location.pathname);
  } catch (e) { /* 忽略 */ }
})();
</script>
