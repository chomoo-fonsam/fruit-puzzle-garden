<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="果园谜题">
  <title>果园谜题 · Fruit Puzzle Garden</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa84c"/>
      <stop offset="1" stop-color="#f2704a"/>
    </linearGradient>
    <linearGradient id="apple" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#d62839"/>
    </linearGradient>
    <linearGradient id="orange" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffb457"/>
      <stop offset="1" stop-color="#ef8a2b"/>
    </linearGradient>
    <linearGradient id="grape" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#b98ae8"/>
      <stop offset="1" stop-color="#7b3fbf"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="6"/>

  <!-- 苹果 -->
  <g>
    <path d="M256 210 C214 168 150 186 150 250 C150 318 210 372 256 372 C302 372 362 318 362 250 C362 186 298 168 256 210 Z" fill="url(#apple)"/>
    <path d="M256 210 C214 168 150 186 150 250 C150 318 210 372 256 372 C302 372 362 318 362 250 C362 186 298 168 256 210 Z" fill="none" stroke="rgba(0,0,0,.10)" stroke-width="5"/>
    <path d="M256 208 C252 176 250 150 244 128" fill="none" stroke="#7a5230" stroke-width="14" stroke-linecap="round"/>
    <path d="M262 152 C296 112 350 118 358 138 C336 176 284 178 262 152 Z" fill="#5fae44"/>
    <ellipse cx="200" cy="250" rx="34" ry="20" fill="rgba(255,255,255,.45)" transform="rotate(-28 200 250)"/>
  </g>

  <!-- 橙子（左下） -->
  <g>
    <circle cx="140" cy="374" r="72" fill="url(#orange)"/>
    <circle cx="140" cy="374" r="72" fill="none" stroke="rgba(0,0,0,.10)" stroke-width="5"/>
    <path d="M140 374 L140 306 M140 374 L198 340 M140 374 L198 408 M140 374 L140 442 M140 374 L82 408 M140 374 L82 340"
          fill="none" stroke="rgba(255,255,255,.45)" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="112" cy="344" rx="22" ry="12" fill="rgba(255,255,255,.5)" transform="rotate(-30 112 344)"/>
  </g>

  <!-- 葡萄（右下） -->
  <g>
    <circle cx="372" cy="330" r="34" fill="url(#grape)"/>
    <circle cx="330" cy="366" r="34" fill="url(#grape)"/>
    <circle cx="414" cy="366" r="34" fill="url(#grape)"/>
    <circle cx="372" cy="402" r="34" fill="url(#grape)"/>
    <circle cx="330" cy="438" r="34" fill="url(#grape)"/>
    <circle cx="414" cy="438" r="34" fill="url(#grape)"/>
    <path d="M372 300 C376 274 384 258 396 246" fill="none" stroke="#7a5230" stroke-width="11" stroke-linecap="round"/>
    <circle cx="358" cy="318" r="10" fill="rgba(255,255,255,.45)"/>
  </g>

  <!-- 顶部三片小叶，点题"果园" -->
  <path d="M96 96 C128 66 168 70 176 84 C152 114 116 116 96 96 Z" fill="rgba(255,255,255,.5)"/>
</svg>
