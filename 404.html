<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>页面不存在 · 果园谜题</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fff8ef; color: #2f2013; text-align: center; padding: 24px;
  }
  @media (prefers-color-scheme: dark) { body { background: #0d1512; color: #f3ece4; } }
  .wrap { max-width: 420px; }
  .mark { font-size: 64px; line-height: 1; }
  h1 { font-size: 20px; margin: 12px 0 6px; }
  p { font-size: 14px; line-height: 1.6; opacity: .75; margin: 0 0 20px; }
  a {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 0 22px; border-radius: 999px; text-decoration: none;
    font-weight: 650; color: #fff;
    background: linear-gradient(140deg, #ffa84c, #f2704a);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">🍎</div>
    <h1>这个页面不在果园里</h1>
    <p>Page not found.<br />链接可能拼错了，或者对应内容已经移动。</p>
    <a href="./">回到游戏首页 →</a>
  </div>
  <script>
    // 直接跳到首页，避免用户卡在 404
    setTimeout(function () { location.replace('./'); }, 2200);
  </script>
</body>
</html>
